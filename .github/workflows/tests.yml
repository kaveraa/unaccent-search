name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets you run the test suite by hand on a branch, from the Actions tab.
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.db }} - ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        db: [sqlite, mysql, mariadb, pgsql]
        dependencies: [highest]
        include:
          # Lowest supported versions: Laravel 12, Symfony 7.2, Doctrine ORM 3.3
          - { php: '8.2', db: sqlite, dependencies: lowest }
          - { php: '8.2', db: mysql, dependencies: lowest }
          - { php: '8.2', db: pgsql, dependencies: lowest }

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: unaccent_search
        ports: ['3306']
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: unaccent_search
        ports: ['3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
      pgsql:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: unaccent_search
        ports: ['5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # Docker picks the ports, so they never clash on the runner
      - run: vendor/bin/phpunit
        env:
          UNACCENT_DB: ${{ matrix.db }}
          UNACCENT_DB_PORT: ${{ matrix.db == 'mysql' && job.services.mysql.ports['3306'] || matrix.db == 'mariadb' && job.services.mariadb.ports['3306'] || matrix.db == 'pgsql' && job.services.pgsql.ports['5432'] || '' }}

  # Single check required by the protection of the main branch:
  # it passes only if every job of the matrix passed.
  tests-passed:
    name: All tests passed
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success"
