<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>

  <!-- Titre -->
  <text x="80" y="118" font-size="64" font-weight="700" fill="#f8fafc">Unaccent Search</text>
  <rect x="80" y="140" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="192" font-size="26" fill="#94a3b8">Laravel  |  Symfony  |  Doctrine</text>

  <!-- Champ de recherche -->
  <rect x="80" y="238" width="380" height="72" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <circle cx="124" cy="270" r="12" fill="none" stroke="#64748b" stroke-width="3"/>
  <line x1="133" y1="279" x2="143" y2="289" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <text x="164" y="284" font-size="32" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace">eleve</text>
  <rect x="266" y="256" width="3" height="36" fill="#38bdf8"/>

  <!-- Flèche -->
  <path d="M488 274 C 560 274, 580 274, 640 274" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Résultats -->
  <g font-size="30" fill="#f8fafc">
    <rect x="672" y="214" width="300" height="52" rx="10" fill="#1e3a5f"/>
    <text x="696" y="250"><tspan fill="#38bdf8" font-weight="700">Élève</tspan></text>
    <rect x="672" y="276" width="300" height="52" rx="10" fill="#1e3a5f"/>
    <text x="696" y="312"><tspan fill="#38bdf8" font-weight="700">ÉLÈVE</tspan> studieux</text>
    <rect x="672" y="338" width="300" height="52" rx="10" fill="#1e3a5f"/>
    <text x="696" y="374">un <tspan fill="#38bdf8" font-weight="700">élève</tspan></text>
  </g>

  <!-- Bases supportées -->
  <g font-size="20" fill="#cbd5e1">
    <rect x="1024" y="214" width="176" height="40" rx="20" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="1112" y="241" text-anchor="middle">MySQL</text>
    <rect x="1024" y="266" width="176" height="40" rx="20" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="1112" y="293" text-anchor="middle">MariaDB</text>
    <rect x="1024" y="318" width="176" height="40" rx="20" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="1112" y="345" text-anchor="middle">PostgreSQL</text>
    <rect x="1024" y="370" width="176" height="40" rx="20" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="1112" y="397" text-anchor="middle">SQLite</text>
  </g>

  <!-- Installation -->
  <text x="80" y="376" font-size="22" fill="#64748b" font-family="Consolas, 'Courier New', monospace">composer require kaveraa/unaccent-search</text>
</svg>
