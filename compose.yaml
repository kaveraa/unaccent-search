# Databases to run the tests on your machine (see README, section Development).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: unaccent_search
    ports: ["33306:3306"]

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: unaccent_search
    ports: ["33307:3306"]

  pgsql:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: unaccent_search
    ports: ["35432:5432"]
